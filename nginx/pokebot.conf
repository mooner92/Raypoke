# PokeBOT reverse proxy — SSE-aware configuration for nginx.
# Replace DOMAIN with your Oracle IP or domain; certbot manages the SSL block.

server {
    listen 80;
    server_name _;
    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;  # Oracle IP 또는 도메인

    # SSL — certbot이 자동으로 채워 넣습니다.
    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;

    # Allow large base64 image payloads on POST /messages
    client_max_body_size 25m;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;

        # ── SSE 필수 설정 ──────────────────────────────
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;   # 24h — SSE 장기 연결 유지
        proxy_send_timeout 86400s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
    }
}
