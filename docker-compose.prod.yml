# Production overlay — adds resource limits and log rotation suited to the
# Oracle Cloud Free Tier. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  pokebot:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
